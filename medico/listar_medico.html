<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listar Médicos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="listar-medico">

  <h1>Listagem de Médicos</h1>

  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="cadastrar_medico.html">Cadastrar</a>
    <a href="editar_medico.html">Editar</a>
    <a href="excluir_medico.html">Excluir</a>
  </nav>

  <div id="mensagem" class="info-message" style="display: none;"></div>

  <div style="text-align: center; margin-bottom: 20px;">
    <input type="text" id="buscarNome" placeholder="Buscar médico por nome" autocomplete="off" />
    <button onclick="buscarPorNome()">Buscar</button>
  </div>

  <h2>Todos os Médicos</h2>
  <div id="listaMedicos" class="doctor-list"></div>

  <div style="text-align: center; margin-top: 20px;">
    <button onclick="carregarMedicos()">Recarregar Lista</button>
  </div>

  <script>
    const API_LISTAR = 'https://system-hospital-project.onrender.com/medicos/findAll';
    let medicos = [];

    // Função de validação do nome
    function validarTextoSeguro(texto) {
      const regex = /^[A-Za-zÀ-ú .'-]{1,50}$/;
      if (!regex.test(texto)) return false;
      if (/[<>&"\/]/.test(texto)) return false;
      return true;
    }

    function exibirMensagem(texto, tipo = "info") {
      const mensagem = document.getElementById("mensagem");
      mensagem.textContent = texto;
      mensagem.style.display = "block";

      if (tipo === "error") {
        mensagem.style.backgroundColor = "#f8d7da";
        mensagem.style.color = "#842029";
      } else if (tipo === "success") {
        mensagem.style.backgroundColor = "#d4f8e8";
        mensagem.style.color = "#007f5f";
      } else {
        mensagem.style.backgroundColor = "#caf0f8";
        mensagem.style.color = "#03045e";
      }

      setTimeout(() => {
        mensagem.style.display = "none";
      }, 3000);
    }

    async function carregarMedicos() {
      const lista = document.getElementById('listaMedicos');
      const msg = document.getElementById('mensagem');
      msg.style.display = 'none';
      lista.innerHTML = '<p>Carregando...</p>';

      try {
        const res = await fetch(API_LISTAR);
        if (!res.ok) throw new Error('Erro ao carregar médicos');
        medicos = await res.json();

        if (medicos.length === 0) {
          lista.innerHTML = '<p>Nenhum médico cadastrado.</p>';
          return;
        }

        mostrarMedicos(medicos);

      } catch (err) {
        lista.innerHTML = '<p>Erro ao buscar médicos.</p>';
        console.error(err);
      }
    }

    function mostrarMedicos(listaMedicos) {
      const lista = document.getElementById('listaMedicos');
      lista.innerHTML = '';

      listaMedicos.forEach(medico => {
        const div = document.createElement('div');
        div.className = 'medico-item';
        div.innerHTML = `
          <p><strong>id:</strong> ${medico.id}</p>
          <p><strong>nome:</strong> ${medico.nome}</p>
          <p><strong>crm:</strong> ${medico.crm}</p>
          <p><strong>especialidade:</strong> ${medico.especialidade}</p>
          <hr/>
        `;
        lista.appendChild(div);
      });
    }

    function buscarPorNome() {
      const termoInput = document.getElementById('buscarNome');
      const termo = termoInput.value.trim();

      if (!termo) {
        exibirMensagem('Digite um nome para buscar.', 'error');
        return;
      }

      if (!validarTextoSeguro(termo)) {
        exibirMensagem('Nome inválido. Use apenas letras, espaço, ponto, hífen e acentos.', 'error');
        return;
      }

      const encontrados = medicos.filter(m => m.nome.toLowerCase().includes(termo.toLowerCase()));

      if (encontrados.length === 0) {
        exibirMensagem('Nenhum médico encontrado com esse nome.', 'error');
        document.getElementById('listaMedicos').innerHTML = '';
        return;
      }

      mostrarMedicos(encontrados);
    }

    carregarMedicos();
  </script>

</body>
</html>
