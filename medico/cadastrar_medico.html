<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Médico</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>



  <h1>Cadastrar Médico</h1>

    <nav class="menu">
    <a href="listar_medico.html">Listar</a>
    <a href="editar_medico.html?id=1">Editar</a>
    <a href="excluir_medico.html?id=1">Excluir</a>
  </nav>

  <form id="formCadastro">
    <label for="nome">Nome:</label><br/>
    <input type="text" id="nome" name="nome" required /><br/><br/>

    <label for="crm">CRM:</label><br/>
    <input
      type="text"
      id="crm"
      name="crm"
      required
      maxlength="8"
      pattern="[A-Za-z0-9]{1,8}"
      title="Informe até 8 caracteres, apenas letras e números"
      inputmode="text"
    /><br/><br/>

    <label for="especialidade">Especialidade:</label><br/>
    <input type="text" id="especialidade" name="especialidade" required /><br/><br/>

    <button type="submit">Cadastrar Médico</button>
  </form>

  <div id="mensagem"></div>

  <script>
    const form = document.getElementById("formCadastro");
    const mensagem = document.getElementById("mensagem");
    const API_URL = "https://system-hospital-project.onrender.com/medicos/create";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const crm = document.getElementById("crm").value.trim();
      const especialidade = document.getElementById("especialidade").value.trim();

      if (!/^[A-Za-z0-9]{1,8}$/.test(crm)) {
        mensagem.style.color = "red";
        mensagem.textContent = "CRM deve conter até 8 caracteres, apenas letras e números.";
        return;
      }

      const medico = { nome, crm, especialidade };

      mensagem.style.color = "black";
      mensagem.textContent = "Enviando...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(medico),
        });

        const data = await res.json();

        if (res.status === 201) {
          mensagem.style.color = "green";
          mensagem.textContent = data.message || "Médico cadastrado com sucesso!";
          form.reset();
        } else {
          mensagem.style.color = "red";
          mensagem.textContent = data.message || "Erro ao cadastrar médico.";
        }
      } catch (error) {
        mensagem.style.color = "red";
        mensagem.textContent = "Erro de conexão com o servidor.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
