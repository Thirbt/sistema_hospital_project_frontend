<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Pacientes</title>
    <link rel="stylesheet" href="pacientes.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="../medico/listar_medico.html">Médicos</a>
        <a href="../Consulta/consulta.html">Agendar Consulta</a>
        <a href="pacientes.html" class="active">Pacientes</a>
    </nav>

    <div class="container">
        <h1 class="main-title">Gerenciar Pacientes</h1>

        <button onclick="abrirModalCadastro()" class="btnAdd">Adicionar Novo Paciente</button>

        <table class="tal-con" id="tabelaPacientes">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th style="width: 15%;">Ações</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <div id="modalPaciente" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="fecharModalCadastro()">&times;</span>
            <h3 id="modalTitulo">Adicionar Paciente</h3>
            <form id="formPaciente" onsubmit="salvarPaciente(event)">
                <input type="hidden" id="pacienteId">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" required>
                <br><br>
                <button type="submit">Salvar</button>
            </form>
        </div>
    </div>

    <div id="modalExcluir" class="modal hidden">
        <div class="modal-content" style="max-width: 400px;">
             <h3 style="text-align: center;">Confirmar Exclusão</h3>
             <p style="text-align: center;">Tem certeza de que deseja excluir este paciente?</p>
             <div style="display: flex; justify-content: space-around; margin-top: 20px;">
                <button onclick="fecharModalExcluir()" style="background-color: #888;">Cancelar</button>
                <button id="btnConfirmarExclusao" style="background-color: #d00000;">Excluir</button>
             </div>
        </div>
    </div>

    <script src="pacientes.js"></script>
</body>
</html>
